name: Deploy ACP.lk API

on:
  push:
    branches: [fb-vps-deployment, dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-acp-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-acp-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lunor-labs/acp-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'deployment-dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "sha_tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "moving_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.moving_tag }}

      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"